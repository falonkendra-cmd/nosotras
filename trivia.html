<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Trivia 💖</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container">

        <a class="navbar-brand" href="index.html">
            ❤️ Sofi & Kendra
        </a>

        <div>

            <a class="btn btn-light m-1" href="index.html">
                Inicio
            </a>

            <a class="btn btn-light m-1" href="galeria.html">
                Galería
            </a>

            <a class="btn btn-light m-1" href="trivia.html">
                Trivia
            </a>

            <a class="btn btn-light m-1" href="carta.html">
                Carta
            </a>

            <a class="btn btn-light m-1" href="meses.html">
                Meses
            </a>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <h1 class="text-center mb-4">
        ❓ 𝙏𝙧𝙞𝙫𝙞𝙖 𝙙𝙚 𝙎𝙤𝙛𝙞 𝙮 𝙆𝙚𝙣𝙙𝙧𝙖
    </h1>


    <form id="quiz">

        <div class="pregunta love-box">

            <h4>
                1. ¿Qᴜé ɴᴏꜱ ɢᴜꜱᴛᴀ ᴄᴏᴍᴇʀ ᴊᴜɴᴛᴀꜱ?
            </h4>

            <label>
                <input type="radio" name="p1" value="0">
                ᴘɪᴢᴢᴀ
            </label>

            <br>

            <label>
                <input type="radio" name="p1" value="1">
                ɢᴏᴍɪᴛᴀꜱ
            </label>

            <br>

            <label>
                <input type="radio" name="p1" value="0">
                ꜱᴜꜱʜɪ
            </label>

        </div>


        <div class="pregunta love-box">

            <h4>
                2. ¿Qᴜé ɴᴏꜱ ɢᴜꜱᴛᴀ ᴠᴇʀ ᴊᴜɴᴛɪᴛᴀꜱ?
            </h4>

            <label>
                <input type="radio" name="p2" value="1">
                ʟᴀ ʀᴏꜱᴀ ᴅᴇ ɢᴜᴀᴅᴀʟᴜᴘᴇ
            </label>

            <br>

            <label>
                <input type="radio" name="p2" value="0">
                ʙʀᴇᴀᴋɪɴɢ ʙᴀᴅ
            </label>

            <br>

            <label>
                <input type="radio" name="p2" value="0">
                ꜱᴛʀᴀɴɢᴇʀ ᴛʜɪɴɢꜱ
            </label>

        </div>


        <div class="pregunta love-box">

            <h4>
                3. ¿Qᴜé ɴᴏꜱ ɢᴜꜱᴛᴀ ʜᴀᴄᴇʀ ᴊᴜɴᴛᴀꜱ?
            </h4>

            <label>
                <input type="radio" name="p3" value="1">
                ᴛᴏᴍᴀʀɴᴏꜱ ꜰᴏᴛᴏꜱ
            </label>

            <br>

            <label>
                <input type="radio" name="p3" value="0">
                ᴇꜱᴄᴀʟᴀʀ ᴍᴏɴᴛᴀñᴀꜱ
            </label>

            <br>

            <label>
                <input type="radio" name="p3" value="0">
                ꜱᴜʀꜰᴇᴀʀ
            </label>

        </div>


        <div class="text-center">

            <button
                type="button"
                class="btn btn-love mt-3"
                onclick="verResultado()"
            >
                Ver resultado
            </button>

        </div>


        <h3
            class="mt-4 text-center"
            id="resultado">
        </h3>

    </form>

</div>


<script>

function verResultado() {

    let puntaje = 0;

    const preguntas =
        document.querySelectorAll(".pregunta");

    preguntas.forEach(pregunta => {

        const seleccion =
            pregunta.querySelector(
                "input[type='radio']:checked"
            );

        if (seleccion) {

            if (seleccion.value == "1") {

                puntaje++;

                pregunta.style.backgroundColor =
                    "#d4edda";

            } else {

                pregunta.style.backgroundColor =
                    "#f8d7da";

            }

        }

    });

    document.getElementById("resultado").innerText =
        "Obtuviste " +
        puntaje +
        " puntos 💖";

}

</script>

</body>
</html>
